name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  gitleaks:
    uses: netresearch/.github/.github/workflows/gitleaks.yml@main
    permissions:
      contents: read
      security-events: write

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: netresearch/.github/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
      pull-requests: write
