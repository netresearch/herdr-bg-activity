name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

jobs:
  python-ci:
    uses: netresearch/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
    with:
      os-versions: '["ubuntu-latest","macos-latest"]'
      python-versions: '["3.10","3.14"]'
      cache: ""
      install-cmd: "python -m pip install --upgrade pip && pip install ruff"
      lint-cmd: "ruff check --no-fix . && ruff format --check ."
      test-cmd: "python -m unittest discover -s tests -v"

  # The Herdr app mods' JavaScript (herdr-app/mods/*/bg.js); no dependencies to install.
  herdr-app-js:
    uses: netresearch/.github/.github/workflows/node-test.yml@main
    permissions:
      contents: read
    with:
      package-manager: npm
      node-version: "24"
      install-cmd: "true"
      test-cmd: "node --import ./tests/js/register.mjs --test 'tests/js/*.test.mjs'"
